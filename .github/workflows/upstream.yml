name: watch-and-build

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Force-build this upstream version (e.g. 1.7.15); empty = latest from appcast'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$FORCED" ]; then
            echo "version=$FORCED" >> "$GITHUB_OUTPUT"
            echo "forced build of $FORCED"
            exit 0
          fi
          LATEST=$(curl -fsS https://skim-app.sourceforge.io/skim.xml \
            | grep -o 'sparkle:shortVersionString="[0-9.]*"' \
            | head -1 | cut -d'"' -f2)
          [ -n "$LATEST" ] || { echo "could not parse appcast"; exit 1; }
          if gh release view "v$LATEST" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$LATEST already released — nothing to do"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "new upstream version: $LATEST"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install svn
        run: brew install subversion
      - name: Fetch upstream
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9.]*$ ]] || { echo "refusing suspicious version: $VERSION"; exit 1; }
          bash scripts/fetch-upstream.sh "$VERSION"
      - name: Patch and build
        run: bash scripts/build.sh
      - name: Sign, notarize, staple
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP=upstream/build/Release/Skim.app
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1{print $2}')
          echo "signing with identity $IDENTITY"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -v "$APP"
          ditto -c -k --keepParent "$APP" Skim-plus.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mv Skim-plus.zip "Skim-plus-${VERSION}.zip"
          gh release create "v${VERSION}" "Skim-plus-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Skim+ ${VERSION}" \
            --notes "Upstream Skim ${VERSION} with the patches in \`patches/\` applied. Signed (Developer ID) and notarized — unzip and run. Build log in the Actions run for this tag."
      - name: Flag on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Needs attention: build failed for upstream ${VERSION}" \
            --body "The automated build for upstream Skim ${VERSION} failed — most likely a patch in \`patches/\` no longer applies to the new source. See the failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
